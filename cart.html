<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech | Modern Electronics Store</title>
    <link rel="icon" href="images/P_1uYZJ7zdgTPaVR0ntNDZbaE9nfxgjyI07jGDcHHc4-c8wqNso5BlNPP5_FJ_y2yoswpdtVYBaFaRomsyTzg_QGjFvSv2DVtooa_ytCZiCOx9iPoRBGynaF3fNKnoyoT5BbPda1KwEdyrRdTtLSZBboc31A1Kn3ULOdHiLTKRRIwH3rlAoKCUT3V6Cp5szw.jpg">
    <link rel="stylesheet" href="style/all.css">
    <link rel="stylesheet" href="style/cart.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="cart-page">

    <div class="cart-header">
        <h1>Your Shopping Cart</h1>
        <p>Review your products before checkout</p>
    </div>

    <div class="cart-content">

        <div class="cart-products" id="cart-products">
            
        </div>

        <div class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>

            <div class="summary-line"></div>

            <div class="summary-total">
                <span>Total</span>
                <span id="total">$0</span>
            </div>

            <button class="checkout-btn">
                Proceed to Checkout
            </button>

            <a href="index.html" class="continue-shopping">
                ← Continue Shopping
            </a>
        </div>

    </div>

</div>
    <script src="JS/cart.js"></script>
</body>
